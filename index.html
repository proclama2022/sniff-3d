<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐕</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sniff - Caccia ai Tartufi</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: #558B2F;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      #loading {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #558B2F 0%, #5D4037 100%);
        color: white;
        z-index: 1000;
      }

      #loading h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
      }

      #loading p {
        font-size: 1.2rem;
        opacity: 0.8;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-top: 2rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="/sniff-3d/assets/index-DqBllElN.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="loading">
        <h1>🐕 Sniff</h1>
        <p>Preparando il bosco...</p>
        <div class="spinner"></div>
      </div>
    </div>
  </body>
</html>
